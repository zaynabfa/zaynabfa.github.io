version: "3"
# this file builds from local Dockerfile
services:
  jekyll:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: al-folio-website
    command: bash -c "
      rm -f Gemfile.lock
      && bundle exec jekyll serve --watch --port=8080 --host=0.0.0.0 --livereload --trace"
    ports:
      - 8080:8080
    volumes:
      - .:/srv/jekyll